services:
  tokenscan:
    build: .
    container_name: tokenscan
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=UTC
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./config.yaml:/app/config.yaml:ro
    command: ["/app/entrypoint.sh"]
